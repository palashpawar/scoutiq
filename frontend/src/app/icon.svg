<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11243f"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="220" cy="220" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="4"/>
  <!-- pitch seen through the lens: halfway line, centre circle, centre spot -->
  <g clip-path="url(#lens)" stroke="#34d399" stroke-opacity="0.55" stroke-width="9" fill="none">
    <rect x="96" y="96" width="248" height="248" fill="#34d399" fill-opacity="0.06" stroke="none"/>
    <line x1="220" y1="100" x2="220" y2="340"/>
    <circle cx="220" cy="220" r="46"/>
  </g>
  <circle cx="220" cy="220" r="13" fill="#6ee7b7"/>
  <!-- lens ring and handle -->
  <circle cx="220" cy="220" r="120" fill="none" stroke="url(#em)" stroke-width="30"/>
  <line x1="312" y1="312" x2="404" y2="404" stroke="url(#em)" stroke-width="44" stroke-linecap="round"/>
</svg>
